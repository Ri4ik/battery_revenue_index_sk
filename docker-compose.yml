x-db-environment: &db-environment
  PGHOST: db
  PGPORT: "5432"
  PGUSER: ${POSTGRES_USER:-bri}
  PGPASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}
  PGDATABASE: ${POSTGRES_DB:-battery_revenue_index}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: battery-revenue-index-sk:${APP_VERSION:-local}
  environment: *db-environment
  logging: *logging

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-battery_revenue_index}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging

  migrate:
    <<: *app
    build:
      context: .
      target: production
    command: ["python", "-m", "tools.migrate_results_db", "--backup-dir", "/backups"]
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  importer:
    <<: *app
    command: ["python", "-m", "tools.import_results_to_db"]
    volumes:
      - type: bind
        source: ./results
        target: /app/results
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  dashboard:
    <<: *app
    depends_on:
      importer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/readyz', timeout=6)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      dashboard:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  backups:
  caddy_data:
  caddy_config:
