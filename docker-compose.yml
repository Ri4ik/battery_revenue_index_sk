x-database-url: &database-url
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-bri}:${POSTGRES_PASSWORD:-bri}@db:5432/${POSTGRES_DB:-battery_revenue_index}

x-worker-env: &worker-env
  <<: *database-url
  TZ: Europe/Bratislava
  ENTSOE_API_KEY: ${ENTSOE_API_KEY:-}
  # empty = OneDrive step disabled
  ONEDRIVE_REMOTE: ${ONEDRIVE_REMOTE:-}
  RCLONE_CONFIG: /config/rclone/rclone.conf
  BRI_RAW_ARCHIVE: /data/raw

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bri}
      POSTGRES_DB: ${POSTGRES_DB:-battery_revenue_index}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Reachable only from this machine (DBeaver/pgAdmin on localhost:5432), not from the network.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Daily pipeline at 16:00 Europe/Bratislava (the only scheduler).
  # Manual run: docker compose exec worker python -m bri.pipeline
  worker:
    build:
      context: .
      args:
        CODE_VERSION: ${CODE_VERSION:-unknown}
    image: battery-revenue-index-sk
    environment: *worker-env
    volumes:
      - raw_archive:/data/raw
      # private, writable: rclone refreshes the OAuth token in rclone.conf (never in git / image)
      - ./secrets/rclone:/config/rclone
    command: /usr/local/bin/supercronic /app/docker/crontab
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    image: battery-revenue-index-sk
    environment: *database-url
    ports:
      - "5050:5050"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # One-time migration of the file-based project (legacy results + inputs) and backfill:
  #   docker compose run --rm migrate
  migrate:
    image: battery-revenue-index-sk
    profiles: ["jobs"]
    environment: *worker-env
    volumes:
      - raw_archive:/data/raw
      - ./secrets/rclone:/config/rclone
      - results:/app/results
      - marketdata:/app/marketdata
    command: python -m bri.migrate
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  raw_archive:
  # legacy file data (seeded from the image / filled by the former updater)
  results:
  marketdata:
